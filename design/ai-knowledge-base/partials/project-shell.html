<!-- ============================================================= -->
<!-- SHARED PROJECT SHELL  (node: gen-project-shell)               -->
<!-- Owns private regions: sidebar + top-bar.                      -->
<!-- Leaf pages MUST include this once and fill only the SLOTs:    -->
<!--   pageTitle · activeNavItem · pageContent                     -->
<!-- Do NOT rebuild / reorder / restyle the sidebar or top-bar.    -->
<!-- ============================================================= -->
<div class="flex h-screen w-full overflow-hidden"
     style="background-color: var(--apple-background); font-family: var(--apple-font-sans); color: var(--apple-foreground);">

  <!-- ===================== PRIVATE REGION: sidebar ===================== -->
  <aside class="flex flex-col shrink-0 w-16 lg:w-60 h-full border-r"
         style="background-color: var(--apple-sidebar); border-color: var(--apple-sidebar-border);">

    <!-- Brand mark -->
    <div class="flex items-center gap-2.5 h-16 shrink-0 px-3 lg:px-5">
      <span class="flex items-center justify-center w-9 h-9 shrink-0 rounded-[var(--apple-radius-md)]"
            style="background-color: var(--apple-primary);">
        <i data-lucide="zap" class="w-[18px] h-[18px]" style="color: var(--apple-surface);"></i>
      </span>
      <span class="hidden lg:block text-[16px] font-semibold tracking-[-0.01em] truncate"
            style="color: var(--apple-sidebar-foreground);">Old Z</span>
    </div>

    <!-- Primary navigation -->
    <nav class="flex flex-col gap-1 px-2 lg:px-3 mt-2 overflow-y-auto" aria-label="主导航">
      <a id="sidebar-workspace" data-dom-id="sidebar-workspace" data-nav-key="workspace" tabindex="0"
         class="nav-item flex items-center justify-center lg:justify-start gap-3 h-10 px-0 lg:px-3 cursor-pointer rounded-[var(--apple-radius-md)] outline-none transition-colors duration-150 focus-visible:ring-2 focus-visible:ring-[var(--apple-primary)]"
         style="color: var(--apple-sidebar-foreground);" title="工作台">
        <i data-lucide="layout-dashboard" class="w-[18px] h-[18px] shrink-0"></i>
        <span class="hidden lg:block text-[14px] font-medium truncate">工作台</span>
      </a>

      <a id="sidebar-files" data-dom-id="sidebar-files" data-nav-key="files" tabindex="0"
         class="nav-item flex items-center justify-center lg:justify-start gap-3 h-10 px-0 lg:px-3 cursor-pointer rounded-[var(--apple-radius-md)] outline-none transition-colors duration-150 focus-visible:ring-2 focus-visible:ring-[var(--apple-primary)]"
         style="color: var(--apple-sidebar-foreground);" title="文件中心">
        <i data-lucide="folder-open" class="w-[18px] h-[18px] shrink-0"></i>
        <span class="hidden lg:block text-[14px] font-medium truncate">文件中心</span>
      </a>

      <a id="sidebar-todos" data-dom-id="sidebar-todos" data-nav-key="todos" tabindex="0"
         class="nav-item flex items-center justify-center lg:justify-start gap-3 h-10 px-0 lg:px-3 cursor-pointer rounded-[var(--apple-radius-md)] outline-none transition-colors duration-150 focus-visible:ring-2 focus-visible:ring-[var(--apple-primary)]"
         style="color: var(--apple-sidebar-foreground);" title="待办">
        <i data-lucide="square-check-big" class="w-[18px] h-[18px] shrink-0"></i>
        <span class="hidden lg:block text-[14px] font-medium truncate">待办</span>
      </a>

      <a id="sidebar-note-editor" data-dom-id="sidebar-note-editor" data-nav-key="note-editor" tabindex="0"
         class="nav-item flex items-center justify-center lg:justify-start gap-3 h-10 px-0 lg:px-3 cursor-pointer rounded-[var(--apple-radius-md)] outline-none transition-colors duration-150 focus-visible:ring-2 focus-visible:ring-[var(--apple-primary)]"
         style="color: var(--apple-sidebar-foreground);" title="笔记">
        <i data-lucide="file-text" class="w-[18px] h-[18px] shrink-0"></i>
        <span class="hidden lg:block text-[14px] font-medium truncate">笔记</span>
      </a>

      <a id="sidebar-ai-chat" data-dom-id="sidebar-ai-chat" data-nav-key="ai-chat" tabindex="0"
         class="nav-item flex items-center justify-center lg:justify-start gap-3 h-10 px-0 lg:px-3 cursor-pointer rounded-[var(--apple-radius-md)] outline-none transition-colors duration-150 focus-visible:ring-2 focus-visible:ring-[var(--apple-primary)]"
         style="color: var(--apple-sidebar-foreground);" title="AI 对话">
        <i data-lucide="message-square" class="w-[18px] h-[18px] shrink-0"></i>
        <span class="hidden lg:block text-[14px] font-medium truncate">AI 对话</span>
      </a>

      <a id="sidebar-timeline" data-dom-id="sidebar-timeline" data-nav-key="timeline" tabindex="0"
         class="nav-item flex items-center justify-center lg:justify-start gap-3 h-10 px-0 lg:px-3 cursor-pointer rounded-[var(--apple-radius-md)] outline-none transition-colors duration-150 focus-visible:ring-2 focus-visible:ring-[var(--apple-primary)]"
         style="color: var(--apple-sidebar-foreground);" title="时间轴">
        <i data-lucide="clock" class="w-[18px] h-[18px] shrink-0"></i>
        <span class="hidden lg:block text-[14px] font-medium truncate">时间轴</span>
      </a>

      <a id="sidebar-settings" data-dom-id="sidebar-settings" data-nav-key="settings" tabindex="0"
         class="nav-item flex items-center justify-center lg:justify-start gap-3 h-10 px-0 lg:px-3 cursor-pointer rounded-[var(--apple-radius-md)] outline-none transition-colors duration-150 focus-visible:ring-2 focus-visible:ring-[var(--apple-primary)]"
         style="color: var(--apple-sidebar-foreground);" title="设置">
        <i data-lucide="settings" class="w-[18px] h-[18px] shrink-0"></i>
        <span class="hidden lg:block text-[14px] font-medium truncate">设置</span>
      </a>
      <!-- SLOT: activeNavItem -->
    </nav>

    <!-- Sidebar footer: user profile + logout (bottom-aligned) -->
    <div class="mt-auto flex items-center gap-2 px-2 lg:px-3 py-3 border-t"
         style="border-color: var(--apple-sidebar-border);">
      <button id="user-avatar" data-dom-id="user-avatar" type="button" aria-label="用户资料"
              class="flex items-center min-w-0 flex-1 justify-center lg:justify-start gap-2.5 h-11 px-0 lg:px-2 cursor-pointer rounded-[var(--apple-radius-md)] outline-none transition-colors duration-150 hover:bg-[var(--apple-sidebar-accent)] focus-visible:ring-2 focus-visible:ring-[var(--apple-primary)]">
        <span class="flex items-center justify-center w-8 h-8 shrink-0 rounded-full text-[13px] font-semibold"
              style="background-color: var(--apple-primary); color: var(--apple-sidebar-primary-foreground);">明</span>
        <span class="hidden lg:flex flex-col min-w-0 text-left">
          <span class="text-[13px] font-semibold leading-tight truncate"
                style="color: var(--apple-sidebar-foreground);">明泽</span>
          <span class="text-[12px] leading-tight truncate"
                style="color: var(--apple-foreground-muted);">个人工作区</span>
        </span>
      </button>
      <button id="user-logout" data-dom-id="user-logout" type="button" aria-label="退出登录"
              class="hidden lg:flex items-center justify-center w-9 h-9 shrink-0 cursor-pointer rounded-[var(--apple-radius-md)] outline-none transition-colors duration-150 hover:bg-[var(--apple-sidebar-accent)] focus-visible:ring-2 focus-visible:ring-[var(--apple-primary)]"
              style="color: var(--apple-foreground-secondary);" title="退出登录">
        <i data-lucide="log-out" class="w-[18px] h-[18px]"></i>
      </button>
    </div>
  </aside>

  <!-- ===================== main column ===================== -->
  <div class="flex flex-col flex-1 min-w-0 h-full">

    <!-- ===================== PRIVATE REGION: top-bar ===================== -->
    <header class="flex items-center gap-3 lg:gap-4 h-16 shrink-0 px-4 lg:px-6 border-b"
            style="background-color: var(--apple-background); border-color: var(--apple-border-light);">

      <!-- Page title (flexible, truncates) -->
      <div class="flex items-center min-w-0 flex-1">
        <h1 class="text-[17px] lg:text-[19px] font-semibold leading-[1.25] truncate"
            style="color: var(--apple-foreground);"><!-- SLOT: pageTitle -->工作台</h1>
      </div>

      <!-- Search (desktop) -->
      <div class="relative hidden md:block w-56 lg:w-72 shrink-0">
        <i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 pointer-events-none"
           style="color: var(--apple-foreground-muted);"></i>
        <input id="topbar-search" data-dom-id="topbar-search" type="search" placeholder="搜索..."
               class="w-full h-9 pl-9 pr-3 text-[14px] rounded-[var(--apple-radius-md)] border outline-none transition-colors duration-150 focus:ring-2 focus:ring-[var(--apple-primary)]"
               style="background-color: var(--apple-background-secondary); border-color: var(--apple-border); color: var(--apple-foreground);">
      </div>

      <!-- Search (compact) -->
      <button type="button" aria-label="搜索"
              class="md:hidden flex items-center justify-center w-9 h-9 shrink-0 rounded-[var(--apple-radius-md)] cursor-pointer outline-none transition-colors duration-150 hover:bg-[var(--apple-surface-hover)] focus-visible:ring-2 focus-visible:ring-[var(--apple-primary)]"
              style="color: var(--apple-foreground-secondary);">
        <i data-lucide="search" class="w-[18px] h-[18px]"></i>
      </button>

      <!-- User avatar (top bar, 32px) -->
      <span class="flex items-center justify-center w-8 h-8 shrink-0 rounded-full text-[13px] font-semibold"
            aria-hidden="true"
            style="background-color: var(--apple-background-secondary); color: var(--apple-foreground-secondary);">明</span>
    </header>

    <!-- ===================== content region ===================== -->
    <!-- Leaf pages inject their body here. Fills remaining space, scrolls. -->
    <div class="flex-1 min-h-0 overflow-y-auto" style="background-color: var(--apple-background);">
      <!-- SLOT: pageContent -->
    </div>
  </div>
</div>

<!-- Shell-owned state styling: active nav (set by leaf via activeNavItem slot) + hover -->
<style>
  .nav-item { -webkit-tap-highlight-color: transparent; }
  .nav-item:hover:not([data-active="true"]) { background-color: var(--apple-sidebar-accent); }
  .nav-item[data-active="true"] { background-color: var(--apple-sidebar-primary); color: var(--apple-sidebar-primary-foreground); }
  @media (prefers-reduced-motion: reduce) {
    .nav-item, #topbar-search, #user-avatar, #user-logout { transition-duration: 0.01ms !important; }
  }
</style>
<script>if (window.lucide) { lucide.createIcons(); }</script>
